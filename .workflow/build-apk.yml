# Gitee Go 流水线：等价 .github/workflows/build.yml（GitHub Actions 版）
# 触发：push 到任一常用分支；构建：JDK17 + Gradle 8.7 + Android SDK 35，assembleDebug 固定签名。
# 签名三件套来自网页端「通用变量」（经 variables.global 引用，与 GitHub Secrets 同名同值）：
#   WALLSWITCH_KEYSTORE_BASE64 / WALLSWITCH_KEYSTORE_PASSWORD / WALLSWITCH_KEY_ALIAS
# 说明：Gitee Go 的 YAML 字段以网页编辑器校验为准，若提示某字段不识别，按其提示微调即可。
version: '1.0'
name: build-apk
displayName: '构建 APK'
# 通用变量：variables.global 列表引用网页端「通用变量」里配置的同名变量
variables:
  global:
    - WALLSWITCH_KEYSTORE_BASE64
    - WALLSWITCH_KEYSTORE_PASSWORD
    - WALLSWITCH_KEY_ALIAS
triggers:
  push:
    branches:
      include:
        - main
        - master
        - ui-redesign
        - gl-engine
stages:
  - name: build
    displayName: 'Gradle 构建'
    steps:
      - step: build@gradle
        name: build_apk
        displayName: 'Android APK 构建（固定签名）'
        jdkVersion: 17
        gradleVersion: 8.7
        commands:
          # 1) 解码 keystore（通用变量注入，不进仓库）
          - 'if [ -z "$WALLSWITCH_KEYSTORE_BASE64" ]; then echo "未配置 WALLSWITCH_KEYSTORE_BASE64，无法固定签名" >&2; exit 1; fi; echo "$WALLSWITCH_KEYSTORE_BASE64" | base64 -d > "$HOME/wallswitch.keystore"'
          # 2) 构建镜像若未预装 Android SDK 则装一套（AGP 8.5.2 要 platform 35、build-tools 34 为其默认需求——两个都预装，34 缺失时 AGP 每次构建会重装一遍）
          - 'export ANDROID_HOME="$HOME/android-sdk"; if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then mkdir -p "$ANDROID_HOME/cmdline-tools"; curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip && unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools" && mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" && yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools" > /dev/null; fi'
          # 3) 构建 debug APK（先删掉 Gitee 预置 init.gradle——它把仓库换成无 androidx 的 aliyun jcenter 镜像，必致依赖解析失败）
          - >-
            rm -f "$HOME/.gradle/init.gradle";
            if [ -x "$GRADLE_HOME/bin/gradle" ]; then export PATH="$GRADLE_HOME/bin:$PATH"; fi;
            if ! command -v gradle >/dev/null 2>&1; then
              mkdir -p "$HOME/gradle" && curl -sSL -o /tmp/gradle.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip &&
              unzip -q -o /tmp/gradle.zip -d "$HOME/gradle";
              export PATH="$HOME/gradle/gradle-8.7/bin:$PATH"; fi;
            export WALLSWITCH_KEYSTORE_PATH="$HOME/wallswitch.keystore" && export ANDROID_HOME="$HOME/android-sdk" &&
            gradle assembleDebug --no-daemon
        artifacts:
          - name: WALLSWITCH_APK
            path:
              - ./app/build/outputs/apk/debug/*.apk
        caches: []
        notify: []
