pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    // PREFER_PROJECT：兼容 CI 预置 init.gradle 注入的镜像仓库（Gitee Go 必需；GitHub Actions 无 init 脚本不受影响）
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "wallswitch"
include ':app'
