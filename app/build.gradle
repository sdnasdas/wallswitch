plugins {
    id 'com.android.application'
}

// CI 固定签名：GitHub Actions 通过环境变量注入 keystore（见 .github/workflows/build.yml），
// 保证每次构建签名一致、可覆盖安装。本地无这些环境变量时回退默认 debug 签名，不影响本地编译。
def signStorePath = System.getenv("WALLSWITCH_KEYSTORE_PATH")
def hasFixedSigning = signStorePath != null && !signStorePath.isEmpty()

android {
    namespace 'io.github.sdnasdas.wallswitch'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.sdnasdas.wallswitch"
        minSdk 26
        targetSdk 35
        // 版本约定：每次提交都递增（versionCode +1，versionName 次版本 +1，如 1.0 -> 1.1 -> 1.2）
        // 这里从 102 跳到 104 是故意的：103/3.96 让给 lan-sync 那条局域网同步，两条线各占一段号，
        // 免得出现两个同名不同内容的 APK（装机靠这个号分辨，UpdateChecker 也是从 CI 的
        // "latest（v3.27 · build 45）" 里读 versionName 比对的）
        // 108/3.101 是"两面 + 换面淡入"那一版，装上后小组件直接不能用，已整体还原 —— 号不回收，
        // 免得装机时出现两个内容不同却同名的包
        // 110/3.103 是「一键设置」那颗图钉叠在角标正下方那一版（整卡被顶到 138dp，位置也没定好），
        // 已改成标题那一行的自绘开关 —— 110 那个包同样不回收
        // 132/3.125 这个号被另一台机器的「直链下载」版先占了，本版顺延到 135/3.128
        // 141/3.134：redesign-ui 分支整体改版（底部三栏 此刻/图库/设置，隐藏手势改成可见入口）
        // 142/3.135：外部应用「分享 / 更多打开方式」直接导入；多张可逐张或按屏幕比例居中批量导入
        // 143/3.136：导入取景后选库（不再默认最近操作的库）；多张批量默认也先选库
        // 144/3.137：库内导入直接落当前库（含库里分享进来）；设置二级页只保留一次入场；裁剪页加「取消导入」
        // 145/3.138：标题功能整体下线；日志卡片小缩略图
        // 146/3.139：设置二级页返回回到原位；转场统一 120+300ms
        // 147/3.140：转场滑距改成屏宽 30%（「新页从右缘推进来」的推移感），退场放宽到 150ms
        // 148/3.141：设置返回位置错位修复；设置里切换日志入口下线；此刻页加一键设置卡
        // 149/3.142：设置一二级转场里底栏收/放挪到换屏空档，首页列表不再看得见跳一档
        // 150/3.143：Tab、进出库、详情与日志统一为设置同款两段式转场，去掉 SharedAxis 的闪顿感
        // 151/3.144：库内与设置二级页改为全屏覆盖层，底栏不再收放；新页预绘制后再进场
        // 152/3.145：进出库改为单页覆盖，旧图库不再先退出，消除换页空白停顿
        // 153/3.146：设置页「清除存量标题」那颗临时入口整体删除 —— 它被 setVisible(false) 后
        // 卡片装饰器仍按旧快照找它的行位置，找不到就跳过整组，「数据管理」整块圆角底跟着没了
        // 155/3.148：设置页菜单去小字 + 标题产品化改名；首页「系统与权限」那颗入口下线，进那页只走顶部「壁纸接管」
        // 159/3.152：桌面触发方式二选一（定时 / 回桌面时切换，回桌面由引擎可见性回调驱动、撤掉定时任务）；
        // 夜间过滤（按缩略图算平均亮度分档 + 多选可批量打「夜间禁用」，时段内只切暗色图，滤空则本轮跳过记日志）
        // 160/3.153 ~ 162/3.155：引擎上报壁纸配色（onComputeColors）+ 配色诊断 +「亮色壁纸压暗」——
        // 荣耀桌面实测不认动态壁纸配色，系统已存下「适合深色文字=是」桌面仍是白字，压暗观感也不可用，已整体还原；号不回收
        // 163/3.156：还原上述三版，代码回到 3.152
        // 164/3.157：包名从 com.example 换成 io.github.sdnasdas（源码包 + applicationId，准备上架），
        // CI 改打 release 包 —— applicationId 即应用身份，换名后旧包无法覆盖安装，需备份后卸载重装
        // 165/3.158：导出目录加默认去向 下载/wallswitch（MediaStore，免权限、卸载不丢），
        // 首次启动引导改为扫默认目录列出备份包供选择，没有则手动选包或跳过
        // 166/3.159：修复首次引导不弹 —— LibraryStore.load 首跑自动建默认库，
        // 「库列表为空」永远成立不了，新装机判定只能看壁纸库文件与壁纸是否为空
        // 167/3.160：修复默认目录扫描扫不到 —— 定制 MediaProvider 不支持在 WHERE 里
        // 筛 RELATIVE_PATH，改为文件名粗筛 + Java 里比路径
        // 168/3.161：扫描再放宽 —— 完全不筛路径，名字命中即列出（默认目录的置顶）；
        // 「没找到」弹窗附扫描诊断，便于排查厂商 MediaProvider 差异
        // 169/3.162：荣耀实测卸载后 MediaStore 条目被清（粗筛命中 0），扫描改三条通道
        // 依次兜底：Downloads 集合 → Files 集合 → /sdcard 文件直读，诊断分别报数
        // 170/3.163：三通道全 0 但文件还在 —— 加全量探测区分「集合整体不可见」与
        // 「仅我们的条目被清」，并触发系统媒体扫描重建索引后补查一轮
        // 171/3.164：引导弹窗加「授权访问默认目录」—— SAF 目录授权不受属主限制，
        // 卸载清了 MediaStore 条目也能列出备份包；授权顺手存为导出目录
        // 172/3.165：引导弹窗精简 —— 没找到只留一句「未找到可还原的备份包」，
        // 三个按钮改竖排胶囊；删掉调试期的扫描诊断与媒体扫描重建代码
        // 173/3.166：数据与文件页加「清理冗余文件」—— 按 library.json 对账三个内部目录，
        // 删孤儿文件；同 id 双格式并存留 JPEG 删 PNG
        versionCode 173
        versionName "3.166"
    }

    signingConfigs {
        fixed {
            if (hasFixedSigning) {
                storeFile file(signStorePath)
                storePassword System.getenv("WALLSWITCH_KEYSTORE_PASSWORD")
                keyAlias System.getenv("WALLSWITCH_KEY_ALIAS")
                keyPassword System.getenv("WALLSWITCH_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (hasFixedSigning) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            if (hasFixedSigning) signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // kotlin-stdlib 1.8 起已并入 jdk7/jdk8 内容，强制旧传递依赖对齐到 1.8.22，避免类重复
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Material3 组件库：圆角按钮/卡片/开关等样式（v2.1 浅色 UI 重设计）
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.9.3'
    // v3.134 改版：设置页走 AndroidX Preference（分组 + 摘要 + 开关，替掉 300dp 抽屉里手写的六张卡片）；
    // 单张详情左右翻页用 ViewPager2；启动页用 core-splashscreen 把 Android 12 以下也统一成同一种样子。
    // 三个都是 Google AndroidX 官方库（Apache 2.0），appcompat/material 已间接带进 fragment 与 viewpager2，
    // 显式声明只为钉住版本
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    implementation 'androidx.media3:media3-transformer:1.6.1'
    // 定时切换后端：≥15 分钟间隔用 WorkManager（系统批量合并、Doze 友好、自动重启恢复）
    implementation 'androidx.work:work-runtime:2.9.1'
    // 本地单测：原 check/ 下的纯 JVM 夹具 2026-10-12 挪进 app/src/test 走 Gradle
    // （junit4 跑断言；org.json 必须给真依赖 —— android.jar 里的 org.json 在单测里
    //  会抛 "not mocked"，用不了）
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // stax-api：AGP 把 android.jar 当 bootclasspath，里面没有 javax.xml.stream
    // （Android 用 XmlPullParser），而夹具复刻的 SharedPreferences 落盘解析在 JVM 上
    // 用 StAX 跑。仅编译期需要（运行期 JDK 的 java.xml 模块提供，classpath 不生效）。
    testImplementation 'javax.xml.stream:stax-api:1.0-2'
}
